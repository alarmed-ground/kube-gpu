apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-serve-script
  namespace: vllm
data:
  vllm_serve.py: |
    #!/usr/bin/env python3
    import os, time, socket, subprocess, sys

    RAY_HEAD = os.environ.get("RAY_HEAD_ADDR", "0.0.0.0")
    GCS_PORT  = int(os.environ.get("RAY_GCS_PORT", "6379"))

    print(f"Waiting for GCS at {RAY_HEAD}:{GCS_PORT} ...")
    deadline = time.time() + 600
    while time.time() < deadline:
        try:
            with socket.create_connection((RAY_HEAD, GCS_PORT), timeout=3):
                print("GCS reachable.")
                break
        except OSError as e:
            elapsed = int(600 - (deadline - time.time()))
            print(f"  {elapsed}s: not ready ({e}), retrying in 5s...")
            time.sleep(5)
    else:
        raise RuntimeError("Timed out waiting for Ray GCS")

    print("Launching vLLM via Ray...")
    cmd = [
                "python3", "-m", "vllm.entrypoints.openai.api_server",
                "--model",                        "/root/.cache/huggingface/hub/models--Qwen--Qwen3.6-35B-A3B",
                "--host",                         "0.0.0.0",
                "--port",                         "8000",
                "--distributed-executor-backend", "ray",
                "--tensor-parallel-size",         "1",
                "--pipeline-parallel-size",       "2",
                "--kv-offloading-size",           "400",
                "--kv-offloading-backend",        "native",
                "--gpu-memory-utilization",       "0.9",
                "--max-num-seqs",                 "32",
                "--max-model-len",                "1010000",
                "--kv-transfer-config",           '{"kv_connector_extra_config": {"lazy_offload": false}}',
                "--no-disable-hybrid-kv-cache-manager",
                "--enable-prefix-caching",
                "--enable-expert-parallel",
                "--mm-encoder-tp-mode",           "data",
                "--reasoning-parser",             "qwen3",
                "--enable-auto-tool-choice",
                "--tool-call-parser",             "qwen3_coder",
                "--attention-config",             '{"use_trtllm_attention": false}',
                "--hf-overrides",                 '{"text_config": {"rope_parameters": {"rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}',
                "--trust-remote-code",
                "--served-model-name",            "intrallmai/intrallm-q3.6",
                "--api-key",                      "",
                "--no-disable-sliding-window",
                "--safetensors-load-strategy=prefetch",
            ]
    print("Running:", " ".join(cmd))
    sys.exit(subprocess.call(cmd))
