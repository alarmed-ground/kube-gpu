---
# Namespace is declared in the manifest, so `kubectl apply` creates it if missing
# and leaves it untouched if it already exists.
apiVersion: v1
kind: Namespace
metadata:
  name: vllm
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: vllm
type: Opaque
stringData:
  # Qwen3.5-0.8B is a public model, so a token is optional (only avoids HF rate limits).
  token: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache-pvc
  namespace: vllm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi   # 0.8B model is only a few GB
  storageClassName: microk8s-hostpath
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-5-0-8b-vllm
  namespace: vllm
  labels:
    app: qwen3-5-0-8b-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-5-0-8b-vllm
  strategy:
    type: Recreate   # RWO PVC + single GPU, no rolling overlap
  template:
    metadata:
      labels:
        app: qwen3-5-0-8b-vllm
    spec:
      nodeName: ws1

      # tolerations:
      #   - key: "nvidia.com/gpu"
      #     operator: "Exists"
      #     effect: "NoSchedule"

      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.27.1
          command: ["vllm", "serve"]
          args:
            - "$(MODEL_CKPT)"
            - "--served-model-name"
            - "Qwen/Qwen3.5-0.8B"
            - "--max-model-len"
            - "32768"
            - "--max-num-seqs"
            - "64"
            - "--max-num-batched-tokens"
            - "8192"
            # Leave GPU headroom in case another workload shares the card
            - "--gpu-memory-utilization"
            - "0.50"
            - "--enable-prefix-caching"
            - "--async-scheduling"
            - "--reasoning-parser"
            - "qwen3"
            - "--tool-call-parser"
            - "qwen3_coder"
            - "--enable-auto-tool-choice"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          env:
            - name: MODEL_CKPT
              value: "Qwen/Qwen3.5-0.8B"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: HF_HOME
              value: /root/.cache/huggingface
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60   # up to 10 min for first download + load
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-5-0-8b-vllm-svc
  namespace: vllm
  labels:
    app: qwen3-5-0-8b-vllm
spec:
  selector:
    app: qwen3-5-0-8b-vllm
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  type: ClusterIP
