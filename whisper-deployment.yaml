apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-large-v3
  namespace: vllm
  labels:
    app: whisper-large-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper-large-v3
  template:
    metadata:
      labels:
        app: whisper-large-v3
    spec:
      nodeName: <node-name-goes-here>
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: <pvc-name-goes-here>
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "2Gi"
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command: ["/bin/sh", "-c"]
        args: [
          "apt-get update -qq && apt-get install -y -q libsndfile1 ffmpeg && pip install -q av 'librosa>=0.10,<0.11' soundfile && vllm serve openai/whisper-large-v3 --host 0.0.0.0 --port 8000 --max-model-len 448 --max-num-seqs 64 --gpu-memory-utilization 0.9 --dtype float16 --api-key <api-key-goes-here> --served-model-name openai/whisper-large-v3"
        ]
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        - name: VLLM_ATTENTION_BACKEND
          value: "TRITON_ATTN"
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "10"
            memory: 20G
            nvidia.com/gpu: "1"
          requests:
            cpu: "2"
            memory: 6G
            nvidia.com/gpu: "1"
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: cache-volume
        - name: shm
          mountPath: /dev/shm
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-large-v3
  namespace: vllm
spec:
  selector:
    app: whisper-large-v3
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
